# BathurstBot's own plugins (meshcore-bot reads this after the main config.ini). Nothing secret:
# the Workers AI account ID and token are files from OpenBao, read at each call.

# bathurstfact (alias bxfact): a short fact about Bathurst, Mount Panorama or the Bathurst 1000.
[Bathurstfact_Command]
enabled = true

# meow: a Super Troopers quote about 3 times in 4, otherwise a short fact about the film. Only on
# the region scope au-nsw-bhs: a meow on au or au-nsw, or in a DM, gets no reply.
[Meow_Command]
enabled = true
scopes = #au-nsw-bhs
quote_share = 0.75

# The pools of AI-written facts (local/service_plugins/factpool_service.py).
[FactPool]
enabled = true
# The bundled Wikipedia passages, quotes and fallback lists (data/ in the repo).
data_dir = /app/bathurstbot/data
# On the bot's volume, so a restart keeps the ready facts.
pool_file = /data/factpool.json
# Facts kept ready per topic.
pool_size = 10
# At most one Workers AI call this often, and none while both pools are full (60 s minimum).
refill_interval_seconds = 180
first_refill_delay_seconds = 30
model = @cf/zai-org/glm-4.7-flash
request_timeout_seconds = 60
account_id_file = /srv/secrets/workers_ai_account_id
token_file = /srv/secrets/workers_ai_token

# The link to the companion (local/service_plugins/linkwatch_service.py). Nothing goes over the air.
[LinkWatch]
enabled = true
# Ask the companion for its clock this often while connected, so openHop's frame server, which
# closes a client that has sent nothing for its tcp_timeout (120 s for a companion added from its
# web page), never sees the bot idle. meshcore-bot's own radio probe is 300 s apart at the least.
keepalive_seconds = 60
# Touched whenever the companion sends anything; the pod's liveness probe fails when it's older
# than stale_after_seconds (keep the two equal: deploy/values.yaml, bathurstbot.liveness).
alive_file = /tmp/bathurstbot-alive
stale_after_seconds = 600
