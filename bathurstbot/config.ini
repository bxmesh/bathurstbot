# BathurstBot's meshcore-bot configuration (meshcore-bot v1.1.0; every key is explained in
# upstream's config.ini.example). The entrypoint renders it at each start into
# /run/bathurstbot/config.ini, putting in the companion's address from OpenBao: this repo is
# public, so the address is never written here. Settings for our own plugins are in
# local/config.ini.
#
# What it does: answers only on #test, only to messages sent with the region scope au, au-nsw or
# au-nsw-bhs, with exactly the commands enabled below. Every other built-in command is disabled
# here by name, because almost all of them default to on.

[Connection]
connection_type = tcp
hostname = @@COMPANION_HOST@@
tcp_port = @@COMPANION_PORT@@
timeout = 30
# Reconnect for ever after losing the companion: 10 s, doubling to at most 60 s between tries.
reconnect_max_retries = 0
reconnect_delay_seconds = 10
reconnect_max_delay_seconds = 60

[Bot]
bot_name = BathurstBot
# The companion keeps its own name: the bot never renames it.
auto_update_device_name = false
enabled = true
# Rate limits are upstream's defaults: 10 s between any two replies, 30 s per user.
timezone = Australia/Sydney
# Bathurst's city centre, for the path and prefix commands' distance guesses.
bot_latitude = -33.42
bot_longitude = 149.58
# No adverts of its own except the advert command's (upstream's defaults, stated).
advert_interval_hours = 0
startup_advert = false
# The bot doesn't manage the companion's contacts or favourites.
auto_manage_contacts = false
# Absolute paths: the rendered config lives in /run/bathurstbot, so relative ones would resolve
# there. The database is on the bot's volume.
db_path = /data/meshcore_bot.db
local_dir_path = /app/local

[Admin]
enabled = false

[Admin_ACL]
# No admins. Upstream lists repeater and webviewer here too; they're disabled below, and left off
# this list so that a DM naming them gets no reply rather than "access denied" (put them back,
# with an admin key, if either is ever enabled). gwx is here: see [Gwx_Command] below.
admin_pubkeys =
admin_commands = reload,channelpause,gwx

[Channels]
# #test only. Public is never monitored, and upstream's guard against it stays on: the
# i_understand_that_running_the_bot_on_the_public_channel... override is never set.
monitor_channels = #test
# DMs are answered, because advert, neighbors and schedule work only in a DM (upstream's design).
respond_to_dms = true
# Only messages scoped au, au-nsw or au-nsw-bhs get an answer, in the same scope. No '*', so an
# unscoped (global) flood gets none.
flood_scopes = #au,#au-nsw,#au-nsw-bhs

[Channels_List]
# What the channels command lists (the bot adds the '#').
bathurst = Bathurst and BxMesh chat
test = BathurstBot and test messages

[Keywords]
test = "ack @[{sender}]{phrase_part} | {connection_info} | Received at: {timestamp}"
ping = "Pong!"
# help's list, fixed: upstream's own lists every loaded command in a DM, disabled ones included.
help = "test ping mt path trace prefix stats channels cmd version contact bxfact meow | DM: advert neighbors schedule | help <command>"

[Banned_Users]
banned_users =

[Localization]
language = en
translation_path = /app/translations/
auto_detect_language = false

[Logging]
log_level = INFO
# Console only: Kubernetes keeps the logs.
log_file =
colored_output = false
meshcore_log_level = INFO

[Region_Warnings]
enabled = false

[Feed_Manager]
feed_manager_enabled = false

[Web_Viewer]
enabled = false

# The neighbors command needs the packet capture service with neighbour discovery on. Here it
# publishes nothing (no MQTT, no file): it's only there for neighbors. Discovery also runs on its
# own schedule, set to the firmware's longest, once every 14 days.
[PacketCapture]
enabled = true
mqtt_enabled = false
output_file =
neighbors_enabled = true
neighbors_interval_hours = 336
neighbors_collect_scopes = false

# ---------------------------------------------------------------------------------------------
# Commands: enabled
# ---------------------------------------------------------------------------------------------

# Mesh tools
[Test_Command]
enabled = true

[Ping_Command]
enabled = true

[Multitest_Command]
enabled = true
aliases = multi, multitrace
response_format = @[{sender}] found {path_count} unique path(s):\n{paths}

[Path_Command]
enabled = true

[Trace_Command]
enabled = true

[Prefix_Command]
enabled = true

# DM only (upstream): one zero-hop neighbour discovery; 15 minutes' cooldown.
[Neighbors_Command]
enabled = true

[Stats_Command]
enabled = true

[Channels_Command]
enabled = true

# DM only (upstream): sends a flood advert; once an hour.
[Advert_Command]
enabled = true

# Info
[Help_Command]
enabled = true

[Cmd_Command]
enabled = true

[Version_Command]
enabled = true

[Contact_Command]
enabled = true

# DM only (upstream's dm_only default).
[Schedule_Command]
enabled = true

# Ours, bathurstfact (bxfact) and meow, are in local/config.ini.

