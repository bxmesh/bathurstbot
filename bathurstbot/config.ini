# gwx (global weather, upstream's alternatives/wx_international.py) loads on its own and has no
# enabled switch. So: not in any channel (channels empty), admin-only (Admin_ACL above) so a DM
# gets only "access denied", and enabled = false so cmd and help don't list it.
[Gwx_Command]
enabled = false
channels =

# reload, channelpause, and also feed and status, are admin-only in upstream's code, whatever
# their enabled switch says: with no admins (Admin_ACL above) nobody can use them, and a DM naming
# one gets "access denied". In a channel they say nothing.
[Reload_Command]
channels =

[Channelpause_Command]
channels =
