{{- $s := .Values.secrets }}
{{- $ns := .Release.Namespace }}
# External Secrets signs in to OpenBao as this service account, with the role named after the
# namespace, which may read only secret/dmz-bathurstbot/... (cluster-terraform's
# stacks/openbao/paths.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  labels:
    {{- include "bathurstbot.labels" . | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  labels:
    {{- include "bathurstbot.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ $s.openbao.server | quote }}
      path: {{ $s.openbao.path | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ $s.openbao.authMountPath | quote }}
          role: {{ $ns | quote }}
          serviceAccountRef:
            name: external-secrets
---
# The bot's secrets, as the files it reads in /srv/secrets: the companion's address (the
# entrypoint puts it into the config at start; never in this public repo), and the Workers AI
# account ID and token (read by the FactPool service at each call).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bathurstbot
  labels:
    {{- include "bathurstbot.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: bathurstbot
  data:
    - secretKey: companion_host
      remoteRef:
        key: {{ $ns }}/companion
        property: host
    - secretKey: companion_port
      remoteRef:
        key: {{ $ns }}/companion
        property: port
    - secretKey: workers_ai_account_id
      remoteRef:
        key: {{ $ns }}/workers-ai
        property: account_id
    - secretKey: workers_ai_token
      remoteRef:
        key: {{ $ns }}/workers-ai
        property: token
